apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: build-nodejs-app
spec:
  params:
    - name: source-repo
      description: Source code repository URL
  workspaces:
    - name: source
  steps:
    - name: install-dependencies
      image: node:16
      workingDir: /workspace/source
      script: |
        npm ci
    - name: run-tests
      image: node:16
      workingDir: /workspace/source
      script: |
        npm test
    - name: build-application
      image: node:16
      workingDir: /workspace/source
      script: |
        npm run build
