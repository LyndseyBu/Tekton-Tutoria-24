apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: nodejs-ci-pipeline
spec:
  params:
    - name: repo-url
      description: Repository URL
    - name: revision
      description: Git revision to build
      default: main
  workspaces:
    - name: shared-workspace
  tasks:
    - name: fetch-source
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: shared-workspace
    - name: build-app
      taskRef:
        name: build-nodejs-app
      runAfter:
        - fetch-source
      workspaces:
        - name: source
          workspace: shared-workspace
